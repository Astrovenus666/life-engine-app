# Streamlit configuration — locks the app to DARK mode and trims the toolbar.
# Lives at:  .streamlit/config.toml

[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1f"
textColor = "#f5f5f5"
primaryColor = "#15803d"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
